services:
  todoapp-postgres:
    image: postgres:18-alpine
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT:-.}/postgres-data:/var/lib/postgresql
    restart: always
    # ports:
    #   - "5432:5432"

  todoapp-postgres-migrate:
    image: migrate/migrate:latest
    container_name: todoapp-migrate-postgres
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forward:
    image: alpine/socat
    container_name: todoapp-port-forward
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    depends_on:
      - todoapp-postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
